<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Interactive Counter App</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>
    <body>
        <div class="container">
            <h1>Interactive Counter App</h1>
            <span class="counter" id="counter">0</span>
            <p>Click in the buttons to interact with the counter:</p>
            <button class="btn-decrease" id="decrease" onclick="decreaseCounter()">Decrease</button>
            <button class="btn-increase" id="increase" onclick="increaseCounter()">Increase</button>
            <button class="btn-reset" id="reset" onclick="resetCounter()">Reset the counter</button>
        </div>
        <script src="../js/functions.js"></script>
    </body>
</html>
